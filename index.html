<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruina App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #4f46e5;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .user-details h2 {
            font-size: 14px;
            margin-bottom: 2px;
        }

        .balance {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card-bg);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid var(--border-color);
        }

        .banner {
            margin: 16px;
            padding: 20px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.2), rgba(236, 72, 153, 0.2));
            border: 1px solid rgba(236, 72, 153, 0.3);
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .banner h1 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .banner p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .games-section {
            padding: 0 16px;
        }

        .section-title {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--text-muted);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .game-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.1s ease;
        }

        .game-card:active {
            transform: scale(0.97);
        }

        .game-info h3 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .game-info p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .game-icon {
            font-size: 32px;
        }

        .card-crash {
            background: linear-gradient(90deg, rgba(16, 185, 129, 0.1), transparent);
            border-left: 4px solid #10b981;
        }

        .card-cases {
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.1), transparent);
            border-left: 4px solid #f59e0b;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            padding-bottom: env(safe-area-inset-bottom, 12px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .nav-item.active {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="user-info">
            <div class="avatar" id="user-avatar">?</div>
            <div class="user-details">
                <h2 id="username">Загрузка...</h2>
                <span style="font-size: 12px; color: var(--text-muted);">Игрок</span>
            </div>
        </div>
        <div class="balance">
            <span>💎</span> <span id="balance-amount">...</span>
        </div>
    </header>

    <div class="banner">
        <h1>Система Ruina</h1>
        <p>Бонус +10% к депозиту</p>
    </div>

    <div class="games-section">
        <h3 class="section-title">Игровые режимы</h3>
        <div class="grid">
            <div class="game-card card-crash" onclick="openGame('Краш')">
                <div class="game-info">
                    <h3>Краш</h3>
                    <p>Сорви куш до падения</p>
                </div>
                <div class="game-icon">📈</div>
            </div>

            <div class="game-card card-cases" onclick="openGame('Кейсы')">
                <div class="game-info">
                    <h3>Кейсы</h3>
                    <p>Открывай и забирай призы</p>
                </div>
                <div class="game-icon">📦</div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active">
            <span style="font-size: 20px;">🎮</span>
            <span>Игры</span>
        </div>
        <div class="nav-item">
            <span style="font-size: 20px;">🎒</span>
            <span>Инвентарь</span>
        </div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const user = tg.initDataUnsafe?.user;
        
        if (user) {
            document.getElementById('username').innerText = user.first_name;
            document.getElementById('user-avatar').innerText = user.first_name.charAt(0).toUpperCase();
        } else {
            document.getElementById('username').innerText = 'Гость';
            document.getElementById('user-avatar').innerText = 'Г';
        }

        // ==========================================
        // НАСТРОЙКА СВЯЗИ С TERMUX
        // ==========================================
        
        // ВСТАВЬ СВОЮ HTTPS ССЫЛКУ ИЗ PINGGY НИЖЕ ВМЕСТО ПРИМЕРА
        const backendUrl = "https://shkjm-91-225-4-163.run.pinggy-free.link"; 
        
        const userId = user ? user.id : 7128871752;

        // Запрашиваем баланс с сервера
        fetch(`${backendUrl}/api/balance/${userId}`)
            .then(response => {
                if (!response.ok) throw new Error("Сервер не ответил");
                return response.json();
            })
            .then(data => {
                document.getElementById('balance-amount').innerText = data.balance.toFixed(2);
            })
            .catch(error => {
                console.error("Ошибка связи:", error);
                document.getElementById('balance-amount').innerText = "Ошибка";
            });

        function openGame(gameName) {
            tg.HapticFeedback.impactOccurred('light');
            tg.showAlert('Запуск: ' + gameName);
        }
    </script>
</body>
</html>
